name: Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    name: Backend Unit Tests (with MySQL Service)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: handover_pertamina
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: "mysql://root:rootpassword@127.0.0.1:3306/handover_pertamina"
      JWT_SECRET: "test_jwt_secret_production_ready_32_chars"
      REFRESH_SECRET: "test_refresh_secret_production_ready_32_chars"
      NODE_ENV: test
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Setup Prisma Client & Test DB Schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Backend Tests
        run: npm test

  test-frontend:
    name: Frontend Component & Logic Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests
        run: npm test

  build-backend-image:
    name: Build & Push Docker Image to GHCR
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-dashboard:
    name: Compile React Native Web Dashboard
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Web Bundle
        env:
          EXPO_PUBLIC_API_URL: https://pertamina-handover.com
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/
          retention-days: 7

  deploy-to-vps:
    name: Deploy Container & Web to SumoPod VPS
    needs: [build-backend-image, build-web-dashboard]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./web-dist

      - name: Setup SSH Key & Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare Destination Directories & Permissions on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            sudo mkdir -p /var/www/handover-web /var/www/handover-web/download /var/www/handover-app/deploy
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /var/www/handover-web /var/www/handover-app
            sudo chmod -R 775 /var/www/handover-web /var/www/handover-app
          EOF

      - name: Sync Static Web Files to VPS
        run: |
          rsync -avz --no-owner --no-group --delete ./web-dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/handover-web/

      - name: Sync Production Deploy Configs to VPS
        run: |
          rsync -avz --no-owner --no-group ./deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/handover-app/deploy/

      - name: Ensure Web File Permissions for Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "sudo chmod -R 755 /var/www/handover-web"

      - name: Execute Docker Compose Rolling Update on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            echo "🚀 [1/5] Logging in to GHCR..."
            echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd /var/www/handover-app

            # Ensure production .env exists by copying existing backend/.env if not present
            if [ ! -f "deploy/docker/.env" ] && [ -f "backend/.env" ]; then
              echo "Creating deploy/docker/.env from existing backend/.env..."
              cp backend/.env deploy/docker/.env
            fi

            echo "🚀 [2/5] Pulling latest backend container image..."
            docker compose -f deploy/docker/docker-compose.prod.yml pull backend

            echo "🚀 [3/5] Applying pending Prisma database migrations safely..."
            docker compose -f deploy/docker/docker-compose.prod.yml run --rm backend npx prisma migrate deploy || true

            # Gracefully stop legacy PM2 if still occupying port 3000
            if command -v pm2 >/dev/null 2>&1 && sudo pm2 list 2>/dev/null | grep -q "pertamina-backend"; then
              echo "Stopping legacy PM2 service to free port 3000 for Docker..."
              sudo pm2 stop pertamina-backend || true
            fi

            echo "🚀 [4/5] Updating running backend container..."
            docker compose -f deploy/docker/docker-compose.prod.yml up -d --no-deps --remove-orphans backend

            echo "🚀 [5/5] Performing Health Check Verification..."
            HEALTH_SUCCESS=0
            for i in {1..10}; do
              if curl -s -f http://127.0.0.1:3000/health > /dev/null; then
                HEALTH_SUCCESS=1
                break
              fi
              echo "Waiting for health check (attempt $i/10)..."
              sleep 3
            done

            if [ $HEALTH_SUCCESS -eq 1 ]; then
              echo "✅ Deployment successful! Service is healthy at /health"
            else
              echo "❌ Health check failed! Initiating rollback..."
              docker compose -f deploy/docker/docker-compose.prod.yml rollback backend || true
              exit 1
            fi
          EOF
