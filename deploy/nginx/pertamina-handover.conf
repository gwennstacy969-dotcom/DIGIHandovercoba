# ==============================================================
# Nginx Configuration for Pertamina HandoverApp (DIGI Handover)
# Production Domain: pertamina-handover.com (and www.pertamina-handover.com)
# File location on VPS: /etc/nginx/sites-available/pertamina-handover.conf
# Enable: sudo ln -sf /etc/nginx/sites-available/pertamina-handover.conf /etc/nginx/sites-enabled/
# ==============================================================

# 1. HTTP -> HTTPS Redirect (Handles pertamina-handover.com, www, and legacy duckdns)
server {
    listen 80;
    listen [::]:80;
    server_name pertamina-handover.com www.pertamina-handover.com pertamina-handover.duckdns.org;

    # Certbot ACME challenge location for SSL verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pertamina-handover.com$request_uri;
    }
}

# 2. Legacy DuckDNS HTTPS Redirect (Redirects old domain to new official domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pertamina-handover.duckdns.org www.pertamina-handover.com;

    ssl_certificate /etc/letsencrypt/live/pertamina-handover.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pertamina-handover.com/privkey.pem;

    location / {
        return 301 https://pertamina-handover.com$request_uri;
    }
}

# 3. Official Primary HTTPS Server Block (pertamina-handover.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pertamina-handover.com;

    # SSL Configuration (Let's Encrypt for pertamina-handover.com)
    ssl_certificate /etc/letsencrypt/live/pertamina-handover.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pertamina-handover.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum file upload size (photos of vehicle damage & verification)
    client_max_body_size 25M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml;

    # Frontend Web Dashboard (React Native Web Static Build)
    root /var/www/handover-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Static assets caching (JS, CSS, images, fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Permanent Public Download Link for Mobile APK
    # URL: https://pertamina-handover.com/download/digi-handover.apk
    location /download/ {
        alias /var/www/handover-web/download/;
        autoindex off;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Backend Express API & Authentication (Proxy to Docker Container)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Service Health Check Endpoint
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Protected Uploads Directory (Requires JWT validation in backend)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Barcode QR Images
    location /barcodes/ {
        proxy_pass http://127.0.0.1:3000/barcodes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Prometheus Metrics (Protected by RBAC in backend)
    location /metrics {
        proxy_pass http://127.0.0.1:3000/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
