services:
  mysql:
    image: mysql:8.0
    container_name: pertamina_handover_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-handover_pertamina}
    ports:
      # Bound to loopback 3307 to avoid collision with any host service on 3306
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - handover_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pertamina_handover_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Bound to loopback only - inaccessible from public internet
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - handover_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/gwennstacy969-dotcom/handover-app/backend:latest}
    container_name: pertamina_handover_backend
    restart: unless-stopped
    ports:
      # Only loopback exposed for Host Nginx reverse proxy
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-handover_pertamina}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://pertamina-handover.com,https://www.pertamina-handover.com}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@pertamina.com}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Critical persistent data folders mounted from host
      - ${UPLOADS_PATH:-/var/www/handover-app/backend/uploads}:/app/uploads
      - ${BARCODES_PATH:-/var/www/handover-app/backend/barcodes}:/app/barcodes
      - ${LOGS_PATH:-/var/www/handover-app/backend/logs}:/app/logs
    networks:
      - handover_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  handover_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
